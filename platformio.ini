; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-fh4r2]
platform = espressif32
board = esp32-s3-fh4r2
framework = arduino
monitor_speed = 115200
monitor_echo = yes

build_flags =
	; NimBLE 默认 CCCD 订阅记录容量只有 8 条:目前3个输入报告 + 电池服务,
	; 每台主机占用 4 条,两台主机即到上限,
	; 触发 NimBLE 的 round-robin 溢出策略静默删除"最旧主机的配对记录"。
	; 提高容量,给多主机 + 反复订阅留足余量。
	-D CONFIG_BT_NIMBLE_MAX_CCCDS=32

;依赖的库，PlatformIO会联网下载这些库参与编译
lib_deps =
	h2zero/NimBLE-Arduino@ 2.5.1
	ayushsharma82/ElegantOTA @ 3.1.7
	fastled/FastLED @ 3.10.3
	tanakamasayuki/TensorFlowLite_ESP32 @ 1.0.0
	invensenseinc/ICM42670P@ 1.0.9
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@ 1.0.4
	esp32async/ESPAsyncWebServer @ 3.12.0
